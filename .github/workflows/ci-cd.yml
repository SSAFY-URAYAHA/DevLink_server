name: CI/CD

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

env:
  IMAGE: ghcr.io/ssafy-urayaha/devlink-server

jobs:
  build:
    name: 빌드 · 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Gradle build (통합 테스트 포함)
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Discord 빌드 실패 알림
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_WEBHOOK_URL 미설정, 알림 생략"; exit 0; fi
          FIRST_LINE=$(printf '%s\n' "$TITLE" | head -n 1)
          TEXT="🐸 **빌드 · 테스트 실패** ($EVENT, $REF)
          $FIRST_LINE
          by $ACTOR · [실행 로그]($RUN_URL)"
          jq -n --arg c "$TEXT" '{content: $c}' > payload.json
          curl -sS -H "Content-Type: application/json" -d @payload.json "$WEBHOOK"

  deploy:
    name: 이미지 push · EC2 배포
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: PROD_ENV 키 검사
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          if [ -z "$PROD_ENV" ]; then
            echo "::error::Secret PROD_ENV 가 비어 있습니다. deploy/.prod.env.example 을 참고해 등록하세요."
            exit 1
          fi
          missing=0
          for key in $(grep -E '^[A-Z_]+=' deploy/.prod.env.example | cut -d= -f1); do
            if ! printf '%s\n' "$PROD_ENV" | grep -q "^$key="; then
              echo "::error::PROD_ENV 에 $key 가 없습니다"
              missing=1
            fi
          done
          exit $missing

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: compose 파일 복사
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/docker-compose.prod.yml
          target: /opt/devlink
          strip_components: 1

      - name: EC2 배포
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PROD_ENV,GHCR_PAT,GHCR_USER
          script: |
            set -e
            cd /opt/devlink
            printf '%s\n' "$PROD_ENV" > .env
            chmod 600 .env
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}

      - name: Discord 배포 알림
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_WEBHOOK_URL 미설정, 알림 생략"; exit 0; fi
          if [ "$STATUS" = "success" ]; then ICON="💡"; TITLE="EC2 배포 성공"; else ICON="🤡"; TITLE="EC2 배포 실패"; fi
          FIRST_LINE=$(printf '%s\n' "$MSG" | head -n 1)
          TEXT="$ICON **$TITLE** (master)
          커밋 ${SHA:0:7} · $FIRST_LINE
          by $ACTOR · [실행 로그]($RUN_URL)"
          jq -n --arg c "$TEXT" '{content: $c}' > payload.json
          curl -sS -H "Content-Type: application/json" -d @payload.json "$WEBHOOK"
