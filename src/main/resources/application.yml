server:
    port: 8080
spring:
    application:
        name: devlink-server
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/devlink}
        username: ${DB_USERNAME:devlink}
        password: ${DB_PASSWORD:devlink}
    jackson:
        time-zone: UTC
        serialization:
            write-dates-as-timestamps: false
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: false
        validate-on-migrate: true
management:
    endpoints:
        web:
            exposure:
                include: health,info
