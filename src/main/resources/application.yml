server:
    port: 8080
devlink:
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:https://devlinkfrontend.vercel.app,https://devlink.ai.kr}
    broker:
        heartbeat-timeout-ms: 40000
        heartbeat-check-interval-ms: 1000
        # ACK 대기는 실제 소켓 전송 직전부터 최대 5초이며, 100ms 간격으로 만료를 확인한다.
        ack-timeout-ms: 5000
        ack-check-interval-ms: 100
spring:
    application:
        name: devlink-server
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/devlink}
        username: ${DB_USERNAME:devlink}
        password: ${DB_PASSWORD:devlink}
    jackson:
        time-zone: UTC
        serialization:
            write-dates-as-timestamps: false
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: false
        validate-on-migrate: true
management:
    endpoints:
        web:
            exposure:
                include: health,info
